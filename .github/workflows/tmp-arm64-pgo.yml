name: tmp arm64 pgo

# Temporary: delete before merge. Runs version-release's optimized portable
# lane for linux-arm64 only and uploads the tarball as a workflow artifact.

on:
  push:
    branches: [ci/arm64-pgo-lto]

permissions:
  contents: read

jobs:
  portable-arm64-optimized:
    runs-on: ubuntu-22.04-arm
    env:
      OPTIMIZE: 'true'
      MOQX_MOXYGEN_PORTABLE: 'ON'
      MOQX_MOXYGEN_CXX_FLAGS: "-march=armv8-a -fno-omit-frame-pointer -fasynchronous-unwind-tables"
      CXX_FLAGS: "-march=armv8-a -fno-omit-frame-pointer -fasynchronous-unwind-tables"
      PLATFORM: linux-arm64
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          scripts/install-system-deps.sh
          sudo apt-get install -y --no-install-recommends \
            ca-certificates libdwarf-dev libxxhash-dev libjemalloc2

      - name: Install the optimized lane's compiler
        run: |
          V=12
          sudo apt-get install -y --no-install-recommends "gcc-$V" "g++-$V"
          { echo "CC=gcc-$V"; echo "CXX=g++-$V"; echo "GCOV_DUMP=gcov-dump-$V"; } >> "$GITHUB_ENV"

      - name: Configure
        run: |
          printf '%s\n' \
            -DMOQX_VERSION_STRING="v0.3.7-arm64-pgo-${GITHUB_SHA::8}" \
            -DCMAKE_C_FLAGS="$CXX_FLAGS" \
            -DCMAKE_CXX_FLAGS="$CXX_FLAGS" \
            -DCMAKE_INSTALL_RPATH='$ORIGIN/../lib' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_LibUnwind=TRUE \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/_install" > "$RUNNER_TEMP/optimize-args"
          mapfile -t ARGS < "$RUNNER_TEMP/optimize-args"
          scripts/configure.sh release-pgo --moxygen from-source "${ARGS[@]}"

      - name: Build
        run: cmake --build build/release-pgo -j "$(getconf _NPROCESSORS_ONLN)"

      - name: Train the profile on moqx, rebuild with it and LTO
        run: |
          bash scripts/pgo/train.sh --relay build/release-pgo/moqx --work-dir "$RUNNER_TEMP/pgo-train"
          mapfile -t ARGS < "$RUNNER_TEMP/optimize-args"
          scripts/configure.sh release-pgo --moxygen from-source -DMOQX_PGO=use "${ARGS[@]}"
          cmake --build build/release-pgo -j "$(getconf _NPROCESSORS_ONLN)"

      - name: Install
        run: cmake --install build/release-pgo

      - name: Bundle non-toolchain dynamic deps
        run: |
          mkdir -p _install/lib
          LIBARCH="$(uname -m)-linux-gnu"
          for lib in \
              libboost_context.so.1.74.0 \
              libgflags.so.2.2 \
              libsodium.so.23 \
              libdouble-conversion.so.3 \
              libevent-2.1.so.7 \
              libzstd.so.1 \
              libcares.so.2 \
              libbrotlidec.so.1 \
              libbrotlienc.so.1 \
              libbrotlicommon.so.1 \
              ; do
            src="/usr/lib/${LIBARCH}/${lib}"
            if [ -f "$src" ]; then
              cp -L "$src" _install/lib/
            fi
          done
          ls -lh _install/lib/

      - name: Package
        run: |
          tar czf "moqx-$PLATFORM.tar.gz" -C _install .
          ls -lh "moqx-$PLATFORM.tar.gz"

      - name: Smoke test
        run: |
          mkdir -p /tmp/moqx-smoke
          tar xzf "moqx-$PLATFORM.tar.gz" -C /tmp/moqx-smoke
          ldd /tmp/moqx-smoke/bin/moqx | tee /tmp/ldd.out
          if grep -q "not found" /tmp/ldd.out; then
            echo "ERROR: missing shared libraries"
            exit 1
          fi
          file /tmp/moqx-smoke/bin/moqx
          /tmp/moqx-smoke/bin/moqx --version
          echo "lto_priv symbols: $(nm /tmp/moqx-smoke/bin/moqx | grep -c lto_priv)"
          readelf -p .comment /tmp/moqx-smoke/bin/moqx | grep -o 'GCC: .*' | sort | uniq -c

      - uses: actions/upload-artifact@v6
        with:
          name: moqx-linux-arm64-optimized
          path: moqx-linux-arm64.tar.gz
          retention-days: 7
          compression-level: 0

name: '🔎 Gemini Review'

# Runs only when the gemini-review label is added: answers unanswered /gemini comments if there are any, else reviews.
# No comment triggers: they can't be filtered by body, so each comment leaves a skipped run.
on:
  pull_request:
    types:
      - 'labeled'

defaults:
  run:
    shell: 'bash'

jobs:
  review:
    # Same-repo heads only: cross-repo heads get no secrets.
    if: |-
      github.event.label.name == 'gemini-review' &&
      github.event.pull_request.head.repo.full_name == github.repository
    # Job-level so a skipped run for another label doesn't cancel a review.
    concurrency:
      group: '${{ github.workflow }}-${{ github.event.pull_request.number }}'
      cancel-in-progress: true
    runs-on: 'ubuntu-latest'
    timeout-minutes: 7
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: |-
          ${{ vars.APP_ID }}
        uses: 'actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf' # ratchet:actions/create-github-app-token@v2
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'read'
          permission-issues: 'write'
          permission-pull-requests: 'write'

      # Lets the label be added again for the next review.
      - name: 'Remove gemini-review label'
        continue-on-error: true
        env:
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          PULL_REQUEST_NUMBER: '${{ github.event.pull_request.number }}'
          REPOSITORY: '${{ github.repository }}'
        run: |-
          gh api --silent -X DELETE "repos/${REPOSITORY}/issues/${PULL_REQUEST_NUMBER}/labels/gemini-review"

      - name: 'Checkout repository'
        uses: 'actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8' # ratchet:actions/checkout@v6
        with:
          persist-credentials: 'false'

      # Comments and thread replies from users with write access that ask /gemini and have no answer yet.
      # Permission, not author_association: the token can't see private org membership.
      - name: 'Find unanswered questions'
        id: 'questions'
        env:
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          GEMINI_LOGIN: '${{ steps.mint_identity_token.outputs.app-slug && format(''{0}[bot]'', steps.mint_identity_token.outputs.app-slug) || ''github-actions[bot]'' }}'
          PULL_REQUEST_NUMBER: '${{ github.event.pull_request.number }}'
          REPOSITORY: '${{ github.repository }}'
        run: |-
          fetch() {
            gh api --paginate "repos/${REPOSITORY}/$1" --jq '.[]' | jq -s . > "${RUNNER_TEMP}/$2"
          }
          fetch "issues/${PULL_REQUEST_NUMBER}/comments" issue.json
          fetch "pulls/${PULL_REQUEST_NUMBER}/comments" thread.json
          fetch "pulls/${PULL_REQUEST_NUMBER}/reviews" review.json
          # 404 means the account no longer exists; any other error must not silently drop a question.
          jq -r '.[] | select(.user.type != "Bot" and (.body // "" | test("(^|\\s)/gemini($|[^\\w-])"; "i"))) | .user.login' \
            "${RUNNER_TEMP}/issue.json" "${RUNNER_TEMP}/thread.json" "${RUNNER_TEMP}/review.json" \
            | sort -u > "${RUNNER_TEMP}/askers.txt"
          : > "${RUNNER_TEMP}/permission.jsonl"
          while read -r login; do
            if ! permission=$(gh api "repos/${REPOSITORY}/collaborators/${login}/permission" --jq '.permission' 2> "${RUNNER_TEMP}/permission.err"); then
              if ! grep -q '(HTTP 404)' "${RUNNER_TEMP}/permission.err"; then
                echo "::error::Could not read the permission of ${login}: $(cat "${RUNNER_TEMP}/permission.err")"
                exit 1
              fi
              permission='none'
            fi
            jq -n --arg login "${login}" --arg permission "${permission}" '{($login): $permission}' >> "${RUNNER_TEMP}/permission.jsonl"
          done < "${RUNNER_TEMP}/askers.txt"
          jq -s 'add // {}' "${RUNNER_TEMP}/permission.jsonl" > "${RUNNER_TEMP}/permission.json"
          jq -n \
            --arg login "${GEMINI_LOGIN}" \
            --slurpfile issue "${RUNNER_TEMP}/issue.json" \
            --slurpfile thread "${RUNNER_TEMP}/thread.json" \
            --slurpfile review "${RUNNER_TEMP}/review.json" \
            --slurpfile permission "${RUNNER_TEMP}/permission.json" '
            def asks: (.body // "") | test("(^|\\s)/gemini($|[^\\w-])"; "i");
            def trusted: .user.type != "Bot" and ($permission[0][.user.login] // "none" | IN("admin", "maintain", "write"));
            [($issue[0] + $thread[0])[] | select(.user.login == $login) | .body // ""
              | capture("<!-- gemini-reply-to: (?<id>[a-z]+-[0-9]+) -->\\s*\\z") | .id] as $answered
            | $thread[0] as $all
            | [
                ($issue[0][] | select(asks and trusted)
                  | {id: "comment-\(.id)", kind: "comment", author: .user.login, body, url: .html_url, created_at}),
                ($review[0][] | select(asks and trusted)
                  | {id: "review-\(.id)", kind: "review", author: .user.login, body, url: .html_url, created_at: .submitted_at}),
                ($all[] | select(asks and trusted) | . as $c | (.in_reply_to_id // .id) as $root
                  | {id: "thread-\(.id)", kind: "thread", reply_to: $root, path, line: (.line // .original_line), diff_hunk,
                     earlier: [$all[] | select((.in_reply_to_id // .id) == $root and .created_at < $c.created_at) | {author: .user.login, body}],
                     author: .user.login, body, url: .html_url, created_at})
              ]
            | map(select(.id | IN($answered[]) | not)) | sort_by(.created_at)' > "${RUNNER_TEMP}/all-questions.json"
          # Gemini can write to the workspace, so the post step reads the RUNNER_TEMP copy.
          jq '.[:10]' "${RUNNER_TEMP}/all-questions.json" > "${RUNNER_TEMP}/gemini-questions.json"
          cp "${RUNNER_TEMP}/gemini-questions.json" gemini-questions.json
          total=$(jq length "${RUNNER_TEMP}/all-questions.json")
          if (( total > 10 )); then
            echo "::warning::Answering 10 of ${total} questions; add the label again for the rest."
          fi
          if (( total > 0 )); then
            echo 'mode=reply' >> "${GITHUB_OUTPUT}"
          fi

      - name: 'Prepare prompt context'
        id: 'context'
        if: |-
          ${{ steps.questions.outputs.mode != 'reply' }}
        shell: 'bash'
        run: |-
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"
          mkdir -p .gemini
          jq -n \
            --arg repo "${REPOSITORY}" \
            --arg pr "${PULL_REQUEST_NUMBER}" \
            '{repository: $repo, pull_request_number: $pr}' > .gemini/context.json
        env:
          REPOSITORY: '${{ github.repository }}'
          PULL_REQUEST_NUMBER: '${{ github.event.pull_request.number }}'

      - name: 'Run Gemini pull request review'
        if: |-
          ${{ steps.questions.outputs.mode != 'reply' }}
        uses: 'google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489' # ratchet:google-github-actions/run-gemini-cli@v0
        id: 'gemini_pr_review'
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          GEMINI_API_KEY: '${{ secrets.OMOQ_GEMINI_API_KEY }}'
          REPOSITORY: '${{ github.repository }}'
          PULL_REQUEST_NUMBER: '${{ github.event.pull_request.number }}'
        with:
          gcp_location: '${{ vars.GOOGLE_CLOUD_LOCATION }}'
          gcp_project_id: '${{ vars.GOOGLE_CLOUD_PROJECT }}'
          gcp_service_account: '${{ vars.SERVICE_ACCOUNT_EMAIL }}'
          gcp_workload_identity_provider: '${{ vars.GCP_WIF_PROVIDER }}'
          gemini_api_key: '${{ secrets.OMOQ_GEMINI_API_KEY }}'
          gemini_cli_version: '${{ vars.GEMINI_CLI_VERSION }}'
          gemini_debug: '${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || ''false'') }}'
          gemini_model: '${{ vars.GEMINI_MODEL || ''gemini-3.1-pro-preview-customtools'' }}'
          google_api_key: '${{ secrets.GOOGLE_API_KEY }}'
          use_gemini_code_assist: '${{ vars.GOOGLE_GENAI_USE_GCA }}'
          use_vertex_ai: '${{ vars.GOOGLE_GENAI_USE_VERTEXAI }}'
          upload_artifacts: '${{ vars.UPLOAD_ARTIFACTS }}'
          workflow_name: 'gemini-review'
          github_pr_number: '${{ github.event.pull_request.number }}'
          settings: |-
            {
              "model": {
                "maxSessionTurns": 20
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.27.0"
                  ],
                  "includeTools": [
                    "add_comment_to_pending_review",
                    "pull_request_read",
                    "pull_request_review_write"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              },
              "tools": {
                "core": [
                  "read_file",
                  "glob",
                  "grep_search",
                  "list_directory",
                  "activate_skill",
                  "mcp_github_*"
                ],
                "allowed": [
                  "mcp_github_add_comment_to_pending_review",
                  "mcp_github_pull_request_read",
                  "mcp_github_pull_request_review_write"
                ]
              }
            }
          extensions: |
            [
              "https://github.com/gemini-cli-extensions/code-review"
            ]
          prompt: '/pr-code-review REPOSITORY=${{ github.repository }} PULL_REQUEST_NUMBER=${{ github.event.pull_request.number }} ADDITIONAL_CONTEXT=none'

      # Approve this run's review if no inline comment or summary finding is above LOW.
      # Gemini's review tool can approve too, so its approval is dismissed if anything is above LOW.
      - name: 'Approve clean review'
        if: |-
          ${{ steps.questions.outputs.mode != 'reply' }}
        env:
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          GEMINI_LOGIN: '${{ steps.mint_identity_token.outputs.app-slug && format(''{0}[bot]'', steps.mint_identity_token.outputs.app-slug) || ''github-actions[bot]'' }}'
          PULL_REQUEST_NUMBER: '${{ github.event.pull_request.number }}'
          REPOSITORY: '${{ github.repository }}'
          STARTED_AT: '${{ steps.context.outputs.started_at }}'
        run: |-
          reviews="repos/${REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}/reviews"
          review=$(gh api --paginate "${reviews}" --jq '.[]' \
            | jq -s -c --arg since "${STARTED_AT}" --arg login "${GEMINI_LOGIN}" \
              '[.[] | select(.user.login == $login and .submitted_at >= $since and (.body // "" | contains("Review Summary")))] | last // empty')
          if [[ -z "${review}" ]]; then
            echo '::notice::Found no Gemini review from this run.'
            exit 0
          fi
          id=$(jq -r .id <<< "${review}")
          state=$(jq -r .state <<< "${review}")
          inline=$(gh api --paginate "${reviews}/${id}/comments" \
            --jq '[.[] | select(.body | test("\\A\\s*(<COMMENT>\\s*)?\\**\\[LOW\\]"; "i") | not)] | length' | jq -s 'add // 0')
          summary=$(jq '[.body // "" | match("\\[(CRITICAL|HIGH|MEDIUM)\\]"; "gi")] | length' <<< "${review}")
          above_low=$(( inline + summary ))
          if [[ "${state}" == 'APPROVED' && "${above_low}" -gt 0 ]]; then
            gh api --silent -X PUT "${reviews}/${id}/dismissals" -f event='DISMISS' \
              -f message="Gemini approved with ${above_low} findings above LOW."
            echo "::warning::Dismissed Gemini's approval: ${above_low} findings above LOW."
          elif [[ "${state}" != 'COMMENTED' ]]; then
            echo "::notice::Gemini review is already ${state}."
          elif [[ "${above_low}" -gt 0 ]]; then
            echo "::notice::${above_low} Gemini findings are above LOW; not approving."
          else
            gh api --silent -X POST "${reviews}" \
              -f commit_id="$(jq -r .commit_id <<< "${review}")" -f event='APPROVE' -f body='Gemini found nothing above LOW.'
          fi

      # Read-only GitHub tools; the next step posts the answers.
      - name: 'Run Gemini replies'
        if: |-
          ${{ steps.questions.outputs.mode == 'reply' }}
        uses: 'google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489' # ratchet:google-github-actions/run-gemini-cli@v0
        id: 'gemini_replies'
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          GEMINI_API_KEY: '${{ secrets.OMOQ_GEMINI_API_KEY }}'
        with:
          gcp_location: '${{ vars.GOOGLE_CLOUD_LOCATION }}'
          gcp_project_id: '${{ vars.GOOGLE_CLOUD_PROJECT }}'
          gcp_service_account: '${{ vars.SERVICE_ACCOUNT_EMAIL }}'
          gcp_workload_identity_provider: '${{ vars.GCP_WIF_PROVIDER }}'
          gemini_api_key: '${{ secrets.OMOQ_GEMINI_API_KEY }}'
          gemini_cli_version: '${{ vars.GEMINI_CLI_VERSION }}'
          gemini_debug: '${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || ''false'') }}'
          gemini_model: '${{ vars.GEMINI_MODEL || ''gemini-3.1-pro-preview-customtools'' }}'
          google_api_key: '${{ secrets.GOOGLE_API_KEY }}'
          use_gemini_code_assist: '${{ vars.GOOGLE_GENAI_USE_GCA }}'
          use_vertex_ai: '${{ vars.GOOGLE_GENAI_USE_VERTEXAI }}'
          upload_artifacts: '${{ vars.UPLOAD_ARTIFACTS }}'
          workflow_name: 'gemini-reply'
          github_pr_number: '${{ github.event.pull_request.number }}'
          settings: |-
            {
              "model": {
                "maxSessionTurns": 20
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.27.0"
                  ],
                  "includeTools": [
                    "pull_request_read"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              },
              "tools": {
                "core": [
                  "read_file",
                  "glob",
                  "grep_search",
                  "list_directory",
                  "write_file",
                  "mcp_github_*"
                ],
                "allowed": [
                  "mcp_github_pull_request_read",
                  "write_file"
                ]
              }
            }
          prompt: >-
            Answer the questions that maintainers asked you on pull request
            #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            They are listed in gemini-questions.json. Each has an id, an author and a body;
            questions in review threads also have the file path, line, diff hunk and the
            earlier comments in their thread. Use this checkout, and pull_request_read for the
            diff and the rest of the discussion. Follow the priorities and path rules in
            GEMINI.md, not its review format. Answer each question directly and briefly in
            GitHub Markdown, cite file:line where it helps, and say so when you are unsure.
            You cannot push or post: for a requested change, describe it or show a patch.
            Write gemini-replies.json as a JSON array of {"id": "<question id>", "body": "<answer>"},
            one entry per question.

      # Thread questions get a reply in the thread; the marker records the question as answered.
      - name: 'Post replies'
        if: |-
          ${{ steps.questions.outputs.mode == 'reply' }}
        env:
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          PULL_REQUEST_NUMBER: '${{ github.event.pull_request.number }}'
          REPOSITORY: '${{ github.repository }}'
        run: |-
          replies=$(jq -c --slurpfile asked "${RUNNER_TEMP}/gemini-questions.json" '
            ($asked[0] | map({(.id): .}) | add) as $byid
            | [.[] | select((.id | type == "string") and $byid[.id] != null and (.body | type == "string" and test("\\S")))]
            | unique_by(.id) | .[] | $byid[.id] as $q
            | {kind: $q.kind, reply_to: $q.reply_to,
               body: ((if $q.kind == "thread" then "" else "In reply to [this comment](\($q.url)):\n\n" end)
                 + .body + "\n\n<!-- gemini-reply-to: \($q.id) -->")}' gemini-replies.json) || replies=''
          if [[ -z "${replies}" ]]; then
            echo '::error::Gemini wrote no answers to gemini-replies.json.'
            exit 1
          fi
          while IFS= read -r reply; do
            body=$(jq -r .body <<< "${reply}")
            if [[ "$(jq -r .kind <<< "${reply}")" == 'thread' ]]; then
              gh api --silent -X POST "repos/${REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}/comments/$(jq -r .reply_to <<< "${reply}")/replies" -f body="${body}"
            else
              gh api --silent -X POST "repos/${REPOSITORY}/issues/${PULL_REQUEST_NUMBER}/comments" -f body="${body}"
            fi
          done <<< "${replies}"
          posted=$(wc -l <<< "${replies}")
          asked=$(jq length "${RUNNER_TEMP}/gemini-questions.json")
          if (( posted < asked )); then
            echo "::error::Gemini answered ${posted} of ${asked} questions; add the label again for the rest."
            exit 1
          fi
          echo "::notice::Posted ${posted} answers."

name: dev build

# On-demand dev kit: source-builds moxygen at the pinned MOXYGEN_REV via the
# superbuild (works for any rev, incl. an unreleased SHA with no prebuilt), then
# packages moqx as one ubuntu-22.04 amd64 tarball (90-day artifact). See BUILD.md.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-build
        with:
          ccache-key: dev-build

      # From source: setup builds the moxygen prefix and configures moqx against
      # it; build.sh compiles.
      - name: Build
        run: |
          scripts/configure.sh --moxygen from-source
          scripts/build.sh

      # The artifact links system glog/gflags/&c. — run it on a box that has run
      # install-system-deps.sh (it is a dev kit, not a self-contained release).
      - name: Package
        id: package
        run: |
          SHORT="${GITHUB_SHA:0:7}"
          ARTIFACT="moqx-ubuntu-22.04-amd64-${SHORT}.tar.gz"
          cmake --install build/default --prefix dist
          tar czf "$ARTIFACT" -C dist .
          ls -la "$ARTIFACT"
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: ${{ steps.package.outputs.artifact }}
          retention-days: 90

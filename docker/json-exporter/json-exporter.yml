# json_exporter config for the moqx stats stack.
#
# Turns admin JSON the aggregate /metrics does not carry into Prometheus
# series. Prometheus scrapes this exporter with ?module=<name>&target=<url>
# (see the moqx-state and moqx-info jobs in prometheus.yml).
#
# Per-track series come from the relay's own /metrics/track, not from here:
# both emitted moqx_track_subscribers, and /state's entries are transient and
# undercount under load (openmoq/moqx#501).
modules:
  moqx:
    metrics:
      # Top-level scalars for cross-checking against the aggregate /metrics.
      - name: moqx_state_active_sessions
        help: Active sessions reported by the admin /state
        path: '{.active_sessions}'
      # Relay identity — carries relay_id as a label so the host-info card can
      # show it. Value is active_sessions (handy scalar to hang the label on).
      - name: moqx_relay
        type: object
        help: Relay identity from the admin /state
        path: '{$}'
        labels:
          relay_id: '{.relay_id}'
        values:
          active_sessions: '{.active_sessions}'
  # Relay build info from the admin /info ({"service":"moqx","version":"x.y.z"}).
  # The value is the jsonpath literal 1 — this is a labels-only info metric
  # (moqx_build_info{service,version} 1), standard build-info gauge pattern.
  moqx_info:
    metrics:
      - name: moqx_build
        type: object
        help: Relay build info from the admin /info
        path: '{$}'
        labels:
          service: '{.service}'
          version: '{.version}'
        values:
          info: '1'

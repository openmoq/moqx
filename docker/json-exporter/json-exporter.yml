# json_exporter config for the moqx stats stack.
#
# Turns relay admin JSON that the aggregate /metrics does NOT carry into
# Prometheus series. Prometheus scrapes this exporter with
# ?module=moqx&target=<state-url> (see the moqx-state job in prometheus.yml).
#
# Per-track series are NOT sourced here: /state no longer carries subscriber
# counts (they were per-thread forwarder counts, meaningless in LocalForwarder
# mode). Use moqx_track_subscribers from the relay's own /metrics/track.
modules:
  moqx:
    metrics:
      # Top-level scalars for cross-checking against the aggregate /metrics.
      - name: moqx_state_active_sessions
        help: Active sessions reported by the admin /state
        path: '{.active_sessions}'
      # Relay identity — carries relay_id as a label so the host-info card can
      # show it. Value is active_sessions (handy scalar to hang the label on).
      - name: moqx_relay
        type: object
        help: Relay identity from the admin /state
        path: '{$}'
        labels:
          relay_id: '{.relay_id}'
        values:
          active_sessions: '{.active_sessions}'
  # Relay build info from the admin /info ({"service","version","start_time",
  # "uptime_seconds"}). The info value is the jsonpath literal 1 — a labels-only
  # info metric (moqx_build_info{service,version} 1), standard build-info gauge
  # pattern. uptime/start_time make relay (not host) uptime graphable.
  moqx_info:
    metrics:
      - name: moqx_build
        type: object
        help: Relay build info from the admin /info
        path: '{$}'
        labels:
          service: '{.service}'
          version: '{.version}'
        values:
          info: '1'
          uptime: '{.uptime_seconds}'
          start_time: '{.start_time}'

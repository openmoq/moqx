# Prometheus scrape config for the moqx stats stack.
# The relay exposes Prometheus-format metrics on its admin port (/metrics).
#
# The relay is scraped at 3s for fine-grained perf history; the relay's metrics
# are fixed-cardinality (~450 series, no per-connection/track labels), so 3s ×
# 365d stays well under the 10G disk cap. Prometheus's own self-metrics are
# scraped coarsely (60s) — they don't need fine resolution and this keeps the
# total sample rate (and disk) down.
global:
  scrape_interval: 3s
  evaluation_interval: 15s

scrape_configs:
  - job_name: moqx-relay
    metrics_path: /metrics
    # HELP/TYPE lines are static and Prometheus does not need them; relays
    # predating the param ignore it.
    params:
      omit_metadata: ['1']
    static_configs:
      - targets: ['moqx:8000']
        labels:
          instance: moqx-relay

  # Host metrics (CPU / NIC / memory) for the dashboard's host panels. 5s so
  # host CPU/NIC saturation lines up with the 3s relay data during load tests.
  # Relay 3s + host 5s ≈ 12 GB/yr; the CI deploy sets PROMETHEUS_RETENTION_SIZE
  # to 20 GB so the 365d time limit (not the size cap) bounds history.
  - job_name: node
    scrape_interval: 5s
    static_configs:
      # node-exporter runs in the host network namespace (so netdev sees the real
      # host NIC, not a container veth), hence it's reached via the host gateway
      # rather than the compose-service name. See docker-compose.yml.
      - targets: ['host.docker.internal:9100']
        labels:
          instance: moqx-host

  # Top-level relay scalars (active_sessions, relay_id) that neither /metrics
  # nor /metrics/track carries, via json_exporter scraping the relay admin
  # /state. Probe pattern: Prometheus hits json-exporter:7979/probe with
  # target=<relay /state>. Per-track series come from /metrics/track instead.
  - job_name: moqx-state
    metrics_path: /probe
    scrape_interval: 5s
    params:
      module: [moqx]
    static_configs:
      - targets: ['http://moqx:8000/state']
        labels:
          instance: moqx-relay
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: json-exporter:7979

  - job_name: prometheus
    scrape_interval: 60s
    static_configs:
      - targets: ['localhost:9090']

  # Relay build info for the banner badge. Cheap endpoint, so it is
  # scraped often enough that a redeploy shows up promptly.
  - job_name: moqx-info
    metrics_path: /probe
    scrape_interval: 15s
    params:
      module: [moqx_info]
    static_configs:
      - targets: ['http://moqx:8000/info']
        labels:
          instance: moqx-relay
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: json-exporter:7979

  # Per-track counters from the relay. One namespace per
  # request: an unscoped scrape covers everything only until the total exceeds
  # the limit, at which point it 400s and takes every namespace down with it,
  # while per-namespace scrapes keep working until a single namespace exceeds
  # it. Targets are namespaces in the safe form, generated from the relay's
  # namespace tree by ns-targets and relabelled into the query.
  - job_name: moqx-track
    metrics_path: /metrics/track
    scrape_interval: 5s
    params:
      limit: ['1000']
      # Most of a per-namespace response is metadata when few tracks match.
      omit_metadata: ['1']
    file_sd_configs:
      - files: ['/etc/prometheus/targets/namespaces.json']
        refresh_interval: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_namespace
      - target_label: __address__
        replacement: moqx:8000
      - target_label: instance
        replacement: moqx-relay
    # Display-form labels: decode the common safe-form escapes (.2d '-', .2e '.')
    # for tables and legends; links and query params keep the safe labels.
    # Interim until the relay emits display labels itself.
    metric_relabel_configs:
      - source_labels: [namespace]
        regex: '(.+)'
        target_label: namespace_display
        replacement: '$1'
      - source_labels: [namespace_display]
        regex: '(.*)\\.2d(.*)'
        target_label: namespace_display
        replacement: '${1}-${2}'
      - source_labels: [namespace_display]
        regex: '(.*)\\.2d(.*)'
        target_label: namespace_display
        replacement: '${1}-${2}'
      - source_labels: [namespace_display]
        regex: '(.*)\\.2d(.*)'
        target_label: namespace_display
        replacement: '${1}-${2}'
      - source_labels: [namespace_display]
        regex: '(.*)\\.2d(.*)'
        target_label: namespace_display
        replacement: '${1}-${2}'
      - source_labels: [namespace_display]
        regex: '(.*)\\.2e(.*)'
        target_label: namespace_display
        replacement: '${1}.${2}'
      - source_labels: [namespace_display]
        regex: '(.*)\\.2e(.*)'
        target_label: namespace_display
        replacement: '${1}.${2}'
      - source_labels: [track]
        regex: '(.+)'
        target_label: track_display
        replacement: '$1'
      - source_labels: [track_display]
        regex: '(.*)\\.2d(.*)'
        target_label: track_display
        replacement: '${1}-${2}'
      - source_labels: [track_display]
        regex: '(.*)\\.2d(.*)'
        target_label: track_display
        replacement: '${1}-${2}'
      - source_labels: [track_display]
        regex: '(.*)\\.2d(.*)'
        target_label: track_display
        replacement: '${1}-${2}'
      - source_labels: [track_display]
        regex: '(.*)\\.2d(.*)'
        target_label: track_display
        replacement: '${1}-${2}'
      - source_labels: [track_display]
        regex: '(.*)\\.2e(.*)'
        target_label: track_display
        replacement: '${1}.${2}'
      - source_labels: [track_display]
        regex: '(.*)\\.2e(.*)'
        target_label: track_display
        replacement: '${1}.${2}'
